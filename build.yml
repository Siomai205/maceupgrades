
name: Build Let There Be More Maces
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - run: unzip -o maceupgrade.zip

      - name: Configure Fabric Maven
        run: |
          cat > maceupgrade/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'let-there-be-more-maces'
          EOF

      - run: mkdir -p maceupgrade/src/main/resources/assets/lettherebemoremaces/textures/item
      - run: cp mace_tier_*.png maceupgrade/src/main/resources/assets/lettherebemoremaces/textures/item/ || true
      - run: cd maceupgrade && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: let-there-be-more-maces
          path: maceupgrade/build/libs/*.jar
