name: Build Let There Be More Maces

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Unpack the mod project
        run: unzip -o maceupgrade.zip

      - name: Use your own textures (square PNGs, 16 to 128 px only)
        run: |
          python3 - <<'PY'
          import glob, shutil, struct
          dest = "maceupgrade/src/main/resources/assets/maceupgrade/textures/item"
          for f in glob.glob("*.png"):
              with open(f, "rb") as fh:
                  head = fh.read(24)
              w, h = struct.unpack(">II", head[16:24])
              if w == h and 16 <= w <= 128:
                  shutil.copy(f, dest)
                  print("using", f, w, "x", h)
              else:
                  print("SKIPPED", f, w, "x", h, "- needs a square PNG between 16 and 128 px")
          PY

      - name: Build
        run: cd maceupgrade && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: lettherebemoremaces-jar
          path: |
            maceupgrade/build/libs/*.jar
            !maceupgrade/build/libs/*-sources.jar
