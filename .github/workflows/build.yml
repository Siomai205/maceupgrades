name: Build Let There Be More Maces

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.14.3"

  - run: unzip -o maceupgrade.zip

  - name: Configure Gradle plugin repositories
    run: |
      cat > maceupgrade/settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              maven {
                  url = 'https://maven.fabricmc.net/'
              }
              gradlePluginPortal()
              mavenCentral()
          }
      }
      rootProject.name = 'maceupgrade'
      EOF

  - name: Fix Loom version
    run: sed -i "s/1.14-SNAPSHOT/1.14.10/" maceupgrade/build.gradle

  - run: mkdir -p maceupgrade/src/main/resources/assets/lettherebemoremaces/textures/item

  - run: cp mace_tier_*.png maceupgrade/src/main/resources/assets/lettherebemoremaces/textures/item/ || true

  - run: cd maceupgrade && gradle build

  - uses: actions/upload-artifact@v4
    with:
      name: let-there-be-more-maces
      path: maceupgrade/build/libs/*.jar
